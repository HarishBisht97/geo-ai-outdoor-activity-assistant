[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoai-outdoor-assistant"
version = "0.1.0"
description = "GeoAI outdoor activity recommendation assistant: live geodata + deterministic ranking + self-hosted SLM"
readme = "../README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "cachetools>=5.3",
  "shapely>=2.0",
  "pyproj>=3.6",
  "huggingface_hub>=0.24",
  "sse-starlette>=2.1",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
slm = ["llama-cpp-python>=0.3.2"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "time-machine>=2.14",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: hits real external APIs (opt-in: pytest -m live)",
  "slm: requires the GGUF model file on disk (opt-in: pytest -m slm)",
]
addopts = "-m 'not live and not slm'"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
